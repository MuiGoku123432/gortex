name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  security-events: write

env:
  # Keeps the private COBOL parser fork off proxy.golang.org and sum.golang.org.
  GOPRIVATE: github.com/MuiGoku123432/tree-sitter-cobol-upgrade

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The module cache holds the private COBOL parser source; never
          # save it to an Actions cache that later (PR) runs can restore.
          cache: false
      - name: Configure read access to the private COBOL parser module
        shell: bash
        env:
          COBOL_PARSER_READ_PAT: ${{ secrets.COBOL_PARSER_READ_PAT }}
        # The URL rewrite holding the token lives only in this step's
        # environment (GIT_CONFIG_*), never in ~/.gitconfig, so this step
        # downloads every module and later steps, including third-party
        # actions, build from the warm module cache without the token.
        run: |
          set -euo pipefail
          if [ -z "${COBOL_PARSER_READ_PAT:-}" ]; then
            echo "::error::COBOL_PARSER_READ_PAT is not configured"
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${COBOL_PARSER_READ_PAT}@github.com/MuiGoku123432/tree-sitter-cobol-upgrade.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/MuiGoku123432/tree-sitter-cobol-upgrade"
          go mod download
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: go.mod
          repo-checkout: false
          # The action runs its own setup-go, which caches modules by default.
          cache: false

  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-fs.sarif
