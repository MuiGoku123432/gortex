name: ARM Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keeps the private COBOL parser fork off proxy.golang.org and sum.golang.org.
  GOPRIVATE: github.com/MuiGoku123432/tree-sitter-cobol-upgrade

jobs:
  bench-arm64:
    name: Benchmark (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The module cache holds the private COBOL parser source; never
          # save it to an Actions cache that later (PR) runs can restore.
          cache: false

      - name: Configure read access to the private COBOL parser module
        shell: bash
        env:
          COBOL_PARSER_READ_PAT: ${{ secrets.COBOL_PARSER_READ_PAT }}
        # The URL rewrite holding the token lives only in this step's
        # environment (GIT_CONFIG_*), never in ~/.gitconfig, so this step
        # downloads every module and later steps, including third-party
        # actions, build from the warm module cache without the token.
        run: |
          set -euo pipefail
          if [ -z "${COBOL_PARSER_READ_PAT:-}" ]; then
            echo "::error::COBOL_PARSER_READ_PAT is not configured"
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${COBOL_PARSER_READ_PAT}@github.com/MuiGoku123432/tree-sitter-cobol-upgrade.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/MuiGoku123432/tree-sitter-cobol-upgrade"
          go mod download

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=3 -benchtime=2s -timeout=20m \
            -run='^$' \
            ./internal/graph/ \
            ./internal/search/ \
            ./internal/parser/languages/ \
            ./internal/resolver/ \
            ./internal/query/ \
            ./internal/indexer/ \
            ./internal/analysis/ \
            | tee bench-arm64.txt

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-arm64-${{ github.sha }}
          path: bench-arm64.txt
          retention-days: 90

      - name: Compare with main (PR only)
        if: github.event_name == 'pull_request'
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260409210113-8e83ce0f7b1c
          # Download baseline from main branch artifact if available
          echo "Benchmark results uploaded. Compare manually with benchstat."

  bench-amd64:
    name: Benchmark (AMD64 baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The module cache holds the private COBOL parser source; never
          # save it to an Actions cache that later (PR) runs can restore.
          cache: false

      - name: Configure read access to the private COBOL parser module
        shell: bash
        env:
          COBOL_PARSER_READ_PAT: ${{ secrets.COBOL_PARSER_READ_PAT }}
        # The URL rewrite holding the token lives only in this step's
        # environment (GIT_CONFIG_*), never in ~/.gitconfig, so this step
        # downloads every module and later steps, including third-party
        # actions, build from the warm module cache without the token.
        run: |
          set -euo pipefail
          if [ -z "${COBOL_PARSER_READ_PAT:-}" ]; then
            echo "::error::COBOL_PARSER_READ_PAT is not configured"
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${COBOL_PARSER_READ_PAT}@github.com/MuiGoku123432/tree-sitter-cobol-upgrade.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/MuiGoku123432/tree-sitter-cobol-upgrade"
          go mod download

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=3 -benchtime=2s -timeout=20m \
            -run='^$' \
            ./internal/graph/ \
            ./internal/search/ \
            ./internal/parser/languages/ \
            ./internal/resolver/ \
            ./internal/query/ \
            ./internal/indexer/ \
            ./internal/analysis/ \
            | tee bench-amd64.txt

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-amd64-${{ github.sha }}
          path: bench-amd64.txt
          retention-days: 90
