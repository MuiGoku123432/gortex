name: Skill drift

# Fences every agent integration's generated output against what is
# checked in — across all platforms (not Claude-only), on every PR (not
# release-only). Two complementary checks run:
#
#   1. The all-platform render golden (go test) byte-compares every
#      adapter's rendered MCP config / instructions / hooks / routing
#      blocks against committed goldens.
#   2. A structural --check that every adapter still emits a gortex
#      registration.
#
# Both build the pure-Go CLI (no -tags llama), so the gate runs on a
# stock runner. When a check fails on an intended change, regenerate and
# commit the goldens:
#   go test ./cmd/gortex -run TestAgentsRenderGolden -update-agent-render

on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/agents/**'
      - 'internal/hooks/**'
      - 'internal/mcp/**'
      - 'cmd/gortex/**'
      - '.github/workflows/skill-drift.yml'
  workflow_dispatch:

env:
  # Keeps the private COBOL parser fork off proxy.golang.org and sum.golang.org.
  GOPRIVATE: github.com/MuiGoku123432/tree-sitter-cobol-upgrade

jobs:
  skill-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The module cache holds the private COBOL parser source; never
          # save it to an Actions cache that later (PR) runs can restore.
          cache: false

      - name: Configure read access to the private COBOL parser module
        shell: bash
        env:
          COBOL_PARSER_READ_PAT: ${{ secrets.COBOL_PARSER_READ_PAT }}
        # The URL rewrite holding the token lives only in this step's
        # environment (GIT_CONFIG_*), never in ~/.gitconfig, so this step
        # downloads every module and later steps, including third-party
        # actions, build from the warm module cache without the token.
        run: |
          set -euo pipefail
          if [ -z "${COBOL_PARSER_READ_PAT:-}" ]; then
            echo "::error::COBOL_PARSER_READ_PAT is not configured"
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${COBOL_PARSER_READ_PAT}@github.com/MuiGoku123432/tree-sitter-cobol-upgrade.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/MuiGoku123432/tree-sitter-cobol-upgrade"
          go mod download

      - name: Build CLI
        run: go build -o gortex ./cmd/gortex/

      - name: All-platform render golden
        run: go test ./cmd/gortex -run TestAgentsRenderGolden -count=1

      - name: All-platform render structural check
        run: ./gortex agents render --check
